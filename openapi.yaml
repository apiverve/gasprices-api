openapi: 3.0.4
info:
  title: Gas Prices
  description: >-
    Gas Prices returns average retail gasoline, diesel and LPG prices from
    official weekly government surveys for the US, the UK, all 27 EU countries
    and the EU average. Pass a country, or a US state, region or city, to get
    the latest week with week-over-week and year-over-year changes, in any
    currency, per liter or per gallon.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/gasprices:
    get:
      summary: Gas Prices
      description: >-
        Get the latest or a historical week of average retail fuel prices for a
        country or US area.
      operationId: gasprices
      parameters:
        - name: country
          in: query
          schema:
            type: string
          required: false
          description: >-
            Country to get prices for: US, GB, EU (the EU average) or any EU
            member code such as DE, FR or PL. Defaults to US. Countries other
            than US require a paid plan.
          example: US
        - name: area
          in: query
          schema:
            type: string
          required: false
          description: >-
            US only: a state code (CA, CO, FL, MA, MN, NY, OH, TX, WA), a region
            (eastcoast, midwest, gulfcoast, rockymountain, westcoast and the
            PADD 1 sub-regions) or a city (losangeles, chicago, houston,
            newyorkcity and more). Omit for the national average. Requires a
            paid plan.
          example: CA
        - name: currency
          in: query
          schema:
            type: string
          required: false
          description: >-
            Currency to return prices in, as an ISO code (e.g. USD, EUR, GBP).
            Defaults to the country's own currency.
          example: USD
        - name: unit
          in: query
          schema:
            type: string
          required: false
          description: >-
            Volume unit to price per: liter or gallon. Defaults to the source's
            unit (gallon for the US, liter elsewhere).
          example: liter
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Date to look up (YYYY-MM-DD). Returns the survey week in effect on
            that date. Omit for the latest week.
          example: '2024-06-15'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: US
                  countryName: United States
                  area: US
                  areaName: United States
                  areaType: national
                  week: '2026-09-28'
                  currency: USD
                  unit: gallon
                  prices:
                    regular: 4.465
                    midgrade: 5.073
                    premium: 5.482
                    diesel: 6.382
                    allGrades: 4.603
                    lpg: null
                  changeDirection: down
                  previousWeek: '2026-09-21'
                  weeklyChange:
                    regular: -0.013
                    midgrade: 0.012
                    premium: 0.022
                    diesel: -0.147
                    allGrades: -0.007
                    lpg: null
                  yearAgoWeek: '2025-09-29'
                  yearlyChange:
                    regular: 1.347
                    midgrade: 1.366
                    premium: 1.415
                    diesel: 2.628
                    allGrades: 1.355
                    lpg: null
                  nativeCurrency: USD
                  nativeUnit: gallon
                  exchangeRate: 1
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
